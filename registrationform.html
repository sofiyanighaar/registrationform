<!DOCTYPE html>
<html>
<title>Registration page
</title>
</head>
<body bgcolor="light blue">
<br>
<br>
<form>
<h1>Registartion form</h1>
<label>First name</label>
<input type="text"name="First name"size="15"/>
<br>
<br>
<label>Middle name</label>
<input type="text"name="Middle name"size="15"/>
<br>
<br>
<label>Last name</label>
<input type="text"name="Last name"size="15"/>
<br>
<br>
<label>course:</label>
<select>
<option value="course">course</option>
<option value="BCA">BCA</option>
<option value="B.tech">B.tech</option>
<option value="MBA">MBA</option>
<option value="M.tech">M.tech</option>
</select>
<br>
<br>
<label>Gender:</label>
<input type="radio"name="Gender"value="male"/>male
<input type="radio"name="Gender"value="female"/>female
<input type="radio"name="Gender"value="others"/>others
<br>
<br>
<label>phone:</label>
<input type="text"name="countrycode"value="+91"size="2"/>
<input type="text"name="phone"size="10"/>
<br>
<br>
<label>Address:cols="20"rows="4"value="address">
</textarea>
<br>
<br>
Email:
<input type="email"id="email">
<br>
Password:
<input type="password"id="pass">
<br>
Re-type password:
<input type="retype"id="retype">
<br>
<input type="button"value="submit"/>
</form>
</body>
</html>
